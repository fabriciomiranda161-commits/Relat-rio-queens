<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relatório Natali - Studio Queens</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ee;
      --paper: #ffffff;
      --ink: #211a1d;
      --muted: #746a70;
      --line: #e3d9d1;
      --rose: #b8336a;
      --rose-dark: #8f214f;
      --gold: #b88a44;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.4;
    }

    .wrap {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 18px 14px 32px;
    }

    header {
      padding: 18px 0 16px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 14px;
    }

    .brand {
      font-size: 13px;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 26px;
      line-height: 1.1;
      margin: 0 0 10px;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .metric {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .value {
      display: block;
      font-weight: 700;
      font-size: 16px;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .client {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }

    .client h2 {
      margin: 0 0 10px;
      font-size: 19px;
    }

    .row {
      margin: 7px 0;
    }

    .row strong {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 2px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 44px;
      padding: 10px 14px;
      border-radius: 8px;
      background: var(--rose);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      width: 100%;
    }

    .btn:active {
      background: var(--rose-dark);
    }

    .empty,
    .error {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      .summary {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="brand">Studio Queens</div>
      <h1>Clientes da Semana</h1>
      <div class="summary">
        <div class="metric">
          <span class="label">Período</span>
          <span class="value" id="periodo">Carregando...</span>
        </div>
        <div class="metric">
          <span class="label">Total de clientes</span>
          <span class="value" id="total">0</span>
        </div>
      </div>
    </header>

    <section id="lista" class="list"></section>
  </main>

  <script>
    function fromBase64Url(value) {
      const base64 = String(value || "").replace(/-/g, "+").replace(/_/g, "/");
      const padded = base64 + "=".repeat((4 - base64.length % 4) % 4);
      return decodeURIComponent(escape(atob(padded)));
    }

    function primeiroNome(nome) {
      return String(nome || "cliente").trim().split(/\s+/)[0];
    }

    function mensagemCliente(cliente) {
      return `Oi, tudo bem, ${primeiroNome(cliente.nome)}?

Estou passando para lembrar sobre o agendamento da sua manutenção.

Sua última manutenção foi realizada em: ${cliente.dataBr}

O prazo recomendado para retornar é de até 30 dias após o último atendimento. Respeitar esse período é importante para manter a estrutura, a segurança e a durabilidade do alongamento.

Após 30 dias, será acrescentada uma taxa de R$ 35,00 ao valor da manutenção.

Caso tenha alguma unha quebrada, descolada ou perdida, peço que me avise com antecedência. O reparo tem o valor de R$ 5,00 por unha, e esse aviso me ajuda a reservar o tempo necessário para o atendimento.

*É necessário responder a esta mensagem para consultar os horários disponíveis e agendar sua manutenção. Este será o único lembrete enviado, portanto, não entrarei em contato novamente em outra data.*`;
    }

    function linkCliente(cliente) {
      return `https://wa.me/${cliente.telefoneFinal}?text=${encodeURIComponent(mensagemCliente(cliente))}`;
    }

    function textoSeguro(value) {
      return String(value || "");
    }

    function render(data) {
      const lista = document.getElementById("lista");
      const clientes = Array.isArray(data.clientes) ? data.clientes : [];

      document.getElementById("periodo").textContent = `${data.inicioBr || ""} até ${data.fimBr || ""}`;
      document.getElementById("total").textContent = String(clientes.length);

      if (!clientes.length) {
        lista.innerHTML = '<div class="empty">Nenhuma cliente encontrada neste relatório.</div>';
        return;
      }

      lista.innerHTML = "";

      clientes.forEach(cliente => {
        const card = document.createElement("article");
        card.className = "client";

        const nome = document.createElement("h2");
        nome.textContent = textoSeguro(cliente.nome);
        card.appendChild(nome);

        const proc = document.createElement("div");
        proc.className = "row";
        proc.innerHTML = `<strong>Procedimento</strong><span></span>`;
        proc.querySelector("span").textContent = textoSeguro(cliente.procedimento);
        card.appendChild(proc);

        const dataAtendimento = document.createElement("div");
        dataAtendimento.className = "row";
        dataAtendimento.innerHTML = `<strong>Atendimento</strong><span></span>`;
        dataAtendimento.querySelector("span").textContent = textoSeguro(cliente.dataBr);
        card.appendChild(dataAtendimento);

        const actions = document.createElement("div");
        actions.className = "actions";

        const link = document.createElement("a");
        link.className = "btn";
        link.href = linkCliente(cliente);
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "Abrir conversa";

        actions.appendChild(link);
        card.appendChild(actions);
        lista.appendChild(card);
      });
    }

    function iniciar() {
      try {
        const params = new URLSearchParams(location.search);
        const raw = params.get("d") || location.hash.replace(/^#/, "");

        if (!raw) {
          throw new Error("Dados do relatório não encontrados.");
        }

        render(JSON.parse(fromBase64Url(raw)));
      } catch (e) {
        document.getElementById("lista").innerHTML = '<div class="error">Não consegui abrir este relatório. Peça para gerar um novo link.</div>';
        console.error("[Relatório Natali]", e);
      }
    }

    iniciar();
  </script>
</body>
</html>
